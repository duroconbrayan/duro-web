<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta de canciones | DURO</title>

    <style>
        :root {
            --orange: #ff5a1f;
            --amber: #ffb347;
            --cyan: #17e9ff;
            --purple: #c72cff;
            --card: rgba(13, 9, 12, .97);
            --text: #ffffff;
            --muted: #cfc8d2;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent !important;
            font-family: Arial, Helvetica, sans-serif;
        }

        .alert-stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            justify-content: flex-start;
            gap: clamp(12px, 1.7vw, 22px);
            padding: clamp(64px, 9vh, 125px) clamp(18px, 3vw, 42px) 20px;
            pointer-events: none;
        }

        .brand-banner {
            position: relative;
            width: min(99vw, 1080px);
            padding-top: clamp(42px, 6vw, 68px);
            z-index: 2;
            animation: brand-breathe 3.8s ease-in-out infinite;
        }

        .brand-glasses {
            position: absolute;
            z-index: 4;
            top: clamp(-20px, -1.8vw, -8px);
            left: 50%;
            width: clamp(165px, 23vw, 250px);
            height: auto;
            transform: translateX(-50%) rotate(-7deg);
            filter:
                drop-shadow(0 0 8px rgba(23, 233, 255, .98))
                drop-shadow(0 0 18px rgba(199, 44, 255, .82))
                drop-shadow(0 9px 12px rgba(0, 0, 0, .78));
            animation: brand-glasses-float 2.2s ease-in-out infinite;
        }

        .brand-shell {
            position: relative;
            isolation: isolate;
            min-height: clamp(150px, 18vw, 192px);
            display: grid;
            align-content: center;
            gap: clamp(6px, 1vw, 11px);
            padding:
                clamp(36px, 4.2vw, 48px)
                clamp(16px, 2.1vw, 25px)
                clamp(20px, 2.6vw, 30px);
            overflow: hidden;
            border: clamp(4px, .58vw, 7px) solid transparent;
            border-radius: clamp(24px, 3.2vw, 36px);
            background:
                linear-gradient(135deg, rgba(14, 8, 24, .985), rgba(8, 11, 19, .985)) padding-box,
                linear-gradient(100deg, #ff351f, #ff2bb8 27%, #7258ff 50%, #13dcff 72%, #ffbd22) border-box;
            background-size: 100% 100%, 260% 100%;
            box-shadow:
                0 18px 44px rgba(0, 0, 0, .72),
                0 0 17px rgba(255, 53, 31, .92),
                0 0 38px rgba(199, 44, 255, .58),
                0 0 56px rgba(23, 233, 255, .34),
                inset 0 0 28px rgba(115, 88, 255, .12);
            animation: brand-border-flow 5s linear infinite;
        }

        .brand-shell::before {
            content: "";
            position: absolute;
            z-index: -1;
            width: 38%;
            height: 210%;
            top: -55%;
            left: -55%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, .13),
                transparent
            );
            transform: skewX(-24deg);
            animation: brand-shine 4.8s ease-in-out infinite;
        }

        .brand-shell::after {
            content: "";
            position: absolute;
            inset: 8px;
            z-index: -1;
            border: 1px solid rgba(255, 255, 255, .13);
            border-radius: clamp(17px, 2.5vw, 28px);
            box-shadow: inset 0 0 18px rgba(23, 233, 255, .08);
        }

        .brand-title {
            overflow: hidden;
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            width: 116%;
            margin-left: -8%;
            font-size: clamp(58px, 8.6vw, 94px);
            font-style: normal;
            font-weight: 900;
            letter-spacing: -.014em;
            line-height: .86;
            text-align: center;
            white-space: nowrap;
            background: linear-gradient(
                95deg,
                #ff4530,
                #ff71c9 24%,
                #ffffff 48%,
                #6ee8ff 73%,
                #ffc928
            );
            background-size: 190% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-stroke: clamp(1.5px, .22vw, 3px) rgba(255, 255, 255, .94);
            filter:
                drop-shadow(0 0 7px rgba(255, 255, 255, .38))
                drop-shadow(0 0 13px rgba(199, 44, 255, .68));
            transform: scaleX(.86);
            animation: title-color-flow 5.5s linear infinite;
        }

        .brand-subrow {
            display: grid;
            grid-template-columns: minmax(32px, 1fr) auto minmax(32px, 1fr);
            align-items: center;
            gap: clamp(10px, 1.8vw, 21px);
        }

        .brand-line {
            height: clamp(4px, .58vw, 7px);
            border-radius: 999px;
            background: linear-gradient(90deg, #ff3f23, #ff3ec8, #6d59ff);
            box-shadow: 0 0 11px rgba(255, 54, 168, .72);
        }

        .brand-line:last-child {
            background: linear-gradient(90deg, #6d59ff, #15e7ff, #ffc52c);
            box-shadow: 0 0 11px rgba(23, 233, 255, .72);
        }

        .brand-subtitle {
            color: #ffffff;
            font-size: clamp(18px, 2.8vw, 31px);
            font-weight: 1000;
            letter-spacing: .035em;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, .33);
        }

        .alert-slot {
            width: 100%;
            min-height: clamp(112px, 15vw, 182px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 1;
        }

        .song-alert {
            position: relative;
            width: min(92vw, 900px);
            min-height: clamp(126px, 14vw, 174px);
            display: grid;
            grid-template-columns: clamp(88px, 11vw, 126px) minmax(0, 1fr);
            align-items: center;
            gap: clamp(18px, 3vw, 32px);
            padding:
                clamp(20px, 2.7vw, 30px)
                clamp(28px, 4vw, 46px)
                clamp(22px, 3vw, 34px)
                clamp(20px, 2.7vw, 30px);
            overflow: hidden;
            color: var(--text);
            border: 3px solid transparent;
            border-radius: clamp(24px, 3vw, 34px);
            background:
                linear-gradient(135deg, rgba(28, 17, 20, .98), var(--card)) padding-box,
                linear-gradient(105deg, var(--orange), #ff8a24 54%, var(--amber)) border-box;
            box-shadow:
                0 24px 70px rgba(0, 0, 0, .72),
                0 0 18px rgba(255, 90, 31, .72),
                0 0 55px rgba(255, 90, 31, .30),
                inset 0 0 42px rgba(255, 179, 71, .055);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-50px) scale(.84);
            transform-origin: top center;
        }

        .song-alert::before {
            content: "";
            position: absolute;
            width: 55%;
            height: 170%;
            top: -35%;
            left: -70%;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 179, 71, .14),
                transparent
            );
            transform: skewX(-22deg);
        }

        .song-alert::after {
            content: "";
            position: absolute;
            left: 4%;
            right: 4%;
            bottom: 8px;
            height: clamp(4px, .6vw, 7px);
            border-radius: 999px;
            background: linear-gradient(90deg, var(--orange), var(--amber));
            box-shadow: 0 0 16px rgba(255, 90, 31, .65);
            transform: scaleX(0);
            transform-origin: left;
        }

        .song-alert.is-visible {
            visibility: visible;
            animation: alert-in .55s cubic-bezier(.18, .89, .32, 1.28) forwards;
        }

        .song-alert.is-visible::before {
            animation: shine 1s .2s ease-out forwards;
        }

        .song-alert.is-visible::after {
            animation: timer 4.2s linear forwards;
        }

        .song-alert.is-exiting {
            animation: alert-out .42s ease-in forwards;
        }

        .check-wrap {
            width: clamp(84px, 10.5vw, 120px);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border: clamp(3px, .4vw, 5px) solid rgba(255, 133, 32, .95);
            border-radius: 50%;
            background: rgba(12, 8, 10, .95);
            box-shadow:
                0 0 0 3px rgba(255, 90, 31, .18),
                0 0 25px rgba(255, 90, 31, .70);
        }

        .check {
            width: 82%;
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #110d0e;
            font-size: clamp(48px, 6.4vw, 76px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(145deg, #ffd44d, #ff951f 55%, var(--orange));
            box-shadow:
                inset 0 3px 4px rgba(255, 255, 255, .42),
                0 0 26px rgba(255, 126, 31, .48);
        }

        .gift-image {
            display: none;
            width: 145%;
            max-width: none;
            filter:
                drop-shadow(0 0 9px rgba(23, 233, 255, .95))
                drop-shadow(0 0 22px rgba(199, 44, 255, .72));
            transform: rotate(-7deg);
        }

        .song-alert.gift-mode {
            background:
                linear-gradient(135deg, rgba(11, 9, 25, .98), var(--card)) padding-box,
                linear-gradient(105deg, var(--purple), var(--cyan) 58%, var(--orange)) border-box;
            box-shadow:
                0 24px 70px rgba(0, 0, 0, .76),
                0 0 20px rgba(23, 233, 255, .64),
                0 0 58px rgba(199, 44, 255, .32),
                inset 0 0 42px rgba(23, 233, 255, .055);
        }

        .song-alert.gift-mode::after {
            background: linear-gradient(
                90deg,
                var(--purple),
                var(--cyan),
                var(--orange)
            );
            box-shadow: 0 0 18px rgba(23, 233, 255, .72);
        }

        .gift-mode .check-wrap {
            border-color: rgba(23, 233, 255, .96);
            background: rgba(8, 7, 20, .96);
            box-shadow:
                0 0 0 3px rgba(199, 44, 255, .20),
                0 0 28px rgba(23, 233, 255, .72);
        }

        .gift-mode .check {
            display: none;
        }

        .gift-mode .gift-image {
            display: block;
            animation: gift-float 1.1s ease-in-out infinite alternate;
        }

        .gift-mode .alert-title {
            color: var(--cyan);
            text-shadow:
                0 0 12px rgba(23, 233, 255, .55),
                0 0 26px rgba(199, 44, 255, .32);
        }

        .gift-mode .alert-song {
            text-shadow: 0 0 18px rgba(199, 44, 255, .46);
        }

        .alert-copy {
            min-width: 0;
            display: grid;
            align-content: center;
            gap: clamp(4px, .7vw, 9px);
        }

        .alert-title {
            color: #ff9d20;
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            font-size: clamp(42px, 7vw, 76px);
            font-style: italic;
            font-weight: 900;
            letter-spacing: .015em;
            line-height: .92;
            text-shadow: 0 0 24px rgba(255, 90, 31, .24);
        }

        .alert-song {
            max-width: 100%;
            overflow: hidden;
            color: #ffffff;
            font-size: clamp(20px, 3.3vw, 38px);
            font-weight: 900;
            letter-spacing: .015em;
            line-height: 1.1;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .alert-cta {
            overflow: hidden;
            color: var(--muted);
            font-size: clamp(12px, 1.8vw, 21px);
            font-weight: 800;
            letter-spacing: .045em;
            line-height: 1.15;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @keyframes alert-in {
            0% {
                opacity: 0;
                transform: translateY(-50px) scale(.84);
            }

            72% {
                opacity: 1;
                transform: translateY(7px) scale(1.025);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes alert-out {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            to {
                opacity: 0;
                transform: translateY(-34px) scale(.94);
            }
        }

        @keyframes timer {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        @keyframes shine {
            from { left: -70%; }
            to { left: 125%; }
        }

        @keyframes gift-float {
            from { transform: rotate(-9deg) translateY(3px) scale(.96); }
            to { transform: rotate(-5deg) translateY(-4px) scale(1.04); }
        }

        @keyframes brand-breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.006); }
        }

        @keyframes brand-glasses-float {
            0%, 100% {
                transform: translateX(-50%) translateY(2px) rotate(-8deg) scale(.98);
            }
            50% {
                transform: translateX(-50%) translateY(-7px) rotate(-5deg) scale(1.035);
            }
        }

        @keyframes brand-border-flow {
            from { background-position: 0 0, 0% 50%; }
            to { background-position: 0 0, 260% 50%; }
        }

        @keyframes title-color-flow {
            from { background-position: 0% 50%; }
            to { background-position: 190% 50%; }
        }

        @keyframes brand-shine {
            0%, 54% { left: -55%; opacity: 0; }
            62% { opacity: 1; }
            88%, 100% { left: 125%; opacity: 0; }
        }

        @media (max-width: 560px) {
            .alert-stage {
                gap: 10px;
                padding: 48px 10px 12px;
            }

            .brand-banner {
                width: 98vw;
                padding-top: 28px;
            }

            .brand-glasses {
                width: 132px;
            }

            .brand-shell {
                min-height: 124px;
                gap: 7px;
                padding: 32px 8px 18px;
                border-radius: 18px;
            }

            .brand-title {
                font-size: 44px;
            }

            .brand-subrow {
                gap: 7px;
            }

            .brand-subtitle {
                font-size: 14px;
            }

            .brand-line {
                height: 4px;
            }

            .song-alert {
                min-height: 104px;
                grid-template-columns: 64px minmax(0, 1fr);
                gap: 14px;
                padding: 15px 18px 19px 14px;
                border-width: 2px;
                border-radius: 20px;
            }

            .check-wrap {
                width: 64px;
                border-width: 3px;
            }

            .check {
                font-size: 38px;
            }

            .alert-title {
                font-size: 35px;
            }

            .alert-song {
                font-size: 17px;
            }

            .alert-cta {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>
    <div class="alert-stage" aria-live="polite" aria-atomic="true">
        <div class="brand-banner" aria-label="Reaccionando a tu canción">
            <img
                class="brand-glasses"
                src="assets/sunglasses-gift.png"
                alt=""
            >

            <div class="brand-shell">
                <div class="brand-title">REACCIONANDO A TU CANCIÓN</div>

                <div class="brand-subrow">
                    <span class="brand-line"></span>
                    <div class="brand-subtitle">
                        ( MANDA GAFAS Y SALTAS LISTA )
                    </div>
                    <span class="brand-line"></span>
                </div>
            </div>
        </div>

        <div class="alert-slot">
            <div id="song-alert" class="song-alert" role="status">
                <div class="check-wrap" aria-hidden="true">
                    <div class="check">✓</div>
                    <img
                        class="gift-image"
                        src="assets/sunglasses-gift.png"
                        alt=""
                    >
                </div>

                <div class="alert-copy">
                    <div id="alert-title" class="alert-title">¡ANOTADO!</div>
                    <div id="alert-song" class="alert-song"></div>
                    <div id="alert-cta" class="alert-cta">
                        MIRA TU PUESTO EN DUROCONBRAYAN.COM
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const REQUESTS_URL =
            "https://playlist-api.bookingelbrayan.workers.dev/requests";

        const GIFT_ALERTS_URL =
            "https://playlist-api.bookingelbrayan.workers.dev/gift-alerts";

        const POLL_INTERVAL = 1500;
        const ALERT_DURATION = 4200;
        const EXIT_DURATION = 450;

        const knownRequestIds = new Set();
        const knownGiftAlertIds = new Set();
        const alertQueue = [];

        let requestsInitialized = false;
        let giftsInitialized = false;
        let alertActive = false;
        let checkingRequests = false;
        let checkingGifts = false;

        function queueSongAlert(song) {
            const cleanSong = String(song || "").trim();

            if (!cleanSong) return;

            alertQueue.push({
                type: "song",
                song: cleanSong
            });

            showNextAlert();
        }

        function queueGiftAlert(giftAlert) {
            const username = String(
                giftAlert?.username || ""
            ).trim();

            if (!username) return;

            alertQueue.push({
                type: "gift",
                username,
                repeatCount: Math.max(
                    1,
                    Number(giftAlert?.repeat_count || 1)
                )
            });

            showNextAlert();
        }

        function showNextAlert() {
            if (alertActive || alertQueue.length === 0) return;

            const alert = document.getElementById("song-alert");
            const title = document.getElementById("alert-title");
            const mainText = document.getElementById("alert-song");
            const cta = document.getElementById("alert-cta");
            const nextAlert = alertQueue.shift();
            const isGift = nextAlert.type === "gift";

            alertActive = true;

            alert.classList.toggle(
                "gift-mode",
                isGift
            );

            if (isGift) {
                const visibleUsername = nextAlert.username.startsWith("@")
                    ? nextAlert.username
                    : `@${nextAlert.username}`;

                title.textContent = "¡SE PUSO LAS GAFAS!";
                mainText.textContent = visibleUsername;
                cta.textContent = nextAlert.repeatCount > 1
                    ? `MANDÓ GAFAS ×${nextAlert.repeatCount} · GRACIAS POR APOYAR`
                    : "GRACIAS POR APOYAR EL DIRECTO";
            } else {
                title.textContent = "¡ANOTADO!";
                mainText.textContent = nextAlert.song;
                cta.textContent = "MIRA TU PUESTO EN DUROCONBRAYAN.COM";
            }

            alert.classList.remove("is-exiting");
            alert.classList.add("is-visible");

            window.setTimeout(() => {
                alert.classList.add("is-exiting");

                window.setTimeout(() => {
                    alert.classList.remove("is-visible", "is-exiting");
                    alertActive = false;
                    showNextAlert();
                }, EXIT_DURATION);
            }, ALERT_DURATION);
        }

        async function checkNewRequests() {
            if (checkingRequests) return;

            checkingRequests = true;

            try {
                const response = await fetch(REQUESTS_URL, {
                    cache: "no-store"
                });

                if (!response.ok) return;

                const requests = await response.json();

                if (!Array.isArray(requests)) return;

                if (!requestsInitialized) {
                    requests.forEach(request => {
                        knownRequestIds.add(String(request.id));
                    });

                    requestsInitialized = true;
                    return;
                }

                const newRequests = requests
                    .filter(request => {
                        return !knownRequestIds.has(String(request.id));
                    })
                    .sort((a, b) => Number(a.id) - Number(b.id));

                newRequests.forEach(request => {
                    knownRequestIds.add(String(request.id));
                    queueSongAlert(request.text);
                });
            } catch (error) {
                console.error("No se pudieron consultar las canciones:", error);
            } finally {
                checkingRequests = false;
            }
        }

        async function checkNewGiftAlerts() {
            if (checkingGifts) return;

            checkingGifts = true;

            try {
                const response = await fetch(GIFT_ALERTS_URL, {
                    cache: "no-store"
                });

                if (!response.ok) return;

                const giftAlerts = await response.json();

                if (!Array.isArray(giftAlerts)) return;

                if (!giftsInitialized) {
                    giftAlerts.forEach(giftAlert => {
                        knownGiftAlertIds.add(String(giftAlert.id));
                    });

                    giftsInitialized = true;
                    return;
                }

                const newGiftAlerts = giftAlerts
                    .filter(giftAlert => {
                        return !knownGiftAlertIds.has(
                            String(giftAlert.id)
                        );
                    })
                    .sort((a, b) => Number(a.id) - Number(b.id));

                newGiftAlerts.forEach(giftAlert => {
                    knownGiftAlertIds.add(String(giftAlert.id));
                    queueGiftAlert(giftAlert);
                });
            } catch (error) {
                console.error(
                    "No se pudieron consultar las Gafas:",
                    error
                );
            } finally {
                checkingGifts = false;
            }
        }

        checkNewRequests();
        checkNewGiftAlerts();
        window.setInterval(checkNewRequests, POLL_INTERVAL);
        window.setInterval(checkNewGiftAlerts, POLL_INTERVAL);

        const params = new URLSearchParams(window.location.search);

        if (params.get("prueba") === "1") {
            window.setTimeout(() => {
                queueSongAlert("ANGELITO — SIN FRONTERAS");
            }, 900);
        }

        if (params.get("prueba") === "gafas") {
            window.setTimeout(() => {
                queueGiftAlert({
                    username: "usuario_duro",
                    repeat_count: 1
                });
            }, 900);
        }
    </script>
</body>
</html>

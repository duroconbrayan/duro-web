<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control DURO</title>
    <link rel="stylesheet" href="style.css?v=8">
</head>

<body>

<main>
    <div class="page-wrap">

        <div class="playlist-header">
            <h1 class="wordmark">DURO</h1>
        </div>

        <div class="admin-panel">

            <input
                type="password"
                id="admin-key"
                placeholder="Clave de administrador"
            >

<input
    type="text"
    id="request-text"
    placeholder="Pega aquí el comentario de la canción"
>

<button onclick="agregarSolicitud()">
    ➕ AGREGAR A LA COLA
</button>

            <button onclick="cambiarEstado(true)">
                🟢 ACTIVAR LIVE
            </button>

            <button onclick="cambiarEstado(false)">
                ⚫ PONER OFFLINE
            </button>

            <p id="admin-result"></p>

            <button onclick="siguienteCancion()">
    ⏭ SIGUIENTE
</button>

<button onclick="borrarLista()">
    🗑 BORRAR LISTA
</button>

<div class="admin-proofs-section">
    <div class="admin-proofs-header">
        <strong>🔔 PRUEBAS PENDIENTES</strong>
        <span id="proofs-count">0</span>
    </div>

    <div id="admin-proofs">
        <p>No hay pruebas pendientes.</p>
    </div>
</div>

            <div id="admin-queue"></div>

        </div>

    </div>
</main>

<script>
const statusURL =
    "https://playlist-api.bookingelbrayan.workers.dev/set-status";
const requestsURL =
    "https://playlist-api.bookingelbrayan.workers.dev/requests";

async function cargarAdminQueue() {

    const contenedor = document.getElementById("admin-queue");

    try {

        const response = await fetch(requestsURL);
        const requests = await response.json();

        const playing = requests.find(item => item.status === "playing");
        const queue = requests.filter(item => item.status === "queue");
        const played = requests
    .filter(item => item.status === "played")
    .sort((a, b) => new Date(b.played_at) - new Date(a.played_at));
    const numeroActual = playing?.play_number || played.length;

        let html = "";

        if (played.length > 0) {
    html += `
        <div class="admin-history">
            <small>YA SONARON</small>
    `;

    played.slice(0, 5).forEach(item => {
        html += `
            <div class="admin-history-item">
                <span>✓</span>
                <strong>${item.text}</strong>
            </div>
        `;
    });

    html += `</div>`;
}

        if (playing) {
            html += `
                <div class="admin-now-playing">
                    <small>AHORA SONANDO</small>
                    <strong>${playing.text}</strong>
                </div>
            `;
        }

        html += `
            <div class="admin-queue-list">
                <small>COLA</small>
        `;

       queue.forEach((item, index) => {
    html += `
        <div class="admin-queue-item">
            <span>#${numeroActual + index + 1}</span>
            <strong>${item.text}</strong>

            <button onclick="ponerSiguiente(${item.id})">
                ⏭ PONER SIGUIENTE
            </button>

            <button onclick="eliminarSolicitud(${item.id})">
    🗑 ELIMINAR
</button>

        </div>
    `;
});

        html += `</div>`;

        contenedor.innerHTML = html;

    } catch (error) {
        contenedor.innerHTML = "Error cargando la cola.";
    }
}

const moveNextURL =
    "https://playlist-api.bookingelbrayan.workers.dev/move-next";

async function ponerSiguiente(id) {

    const key = document.getElementById("admin-key").value;
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    try {

        const response = await fetch(moveNextURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
                id: id
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Error";
            return;
        }

        result.textContent = "⏭ Canción puesta como próxima";

        cargarAdminQueue();

    } catch (error) {
        result.textContent = "Error de conexión";
    }
}

const clearURL =
    "https://playlist-api.bookingelbrayan.workers.dev/clear";

async function borrarLista() {

    const key = document.getElementById("admin-key").value;
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    const confirmar = confirm(
        "¿Seguro que quieres borrar TODA la lista?"
    );

    if (!confirmar) return;

    try {

        const response = await fetch(clearURL, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${key}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Error";
            return;
        }

        result.textContent = "🗑 Lista borrada";
        cargarAdminQueue();

    } catch (error) {
        result.textContent = "Error de conexión";
    }
}

const deleteRequestURL =
    "https://playlist-api.bookingelbrayan.workers.dev/delete-request";

async function eliminarSolicitud(id) {

    const key = document.getElementById("admin-key").value;
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    const confirmar = confirm(
        "¿Seguro que quieres eliminar esta canción?"
    );

    if (!confirmar) return;

    try {

        const response = await fetch(deleteRequestURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
                id: id
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Error";
            return;
        }

        result.textContent = "🗑 Canción eliminada";

        cargarAdminQueue();

    } catch (error) {
        result.textContent = "Error de conexión";
    }
}

const nextURL =
    "https://playlist-api.bookingelbrayan.workers.dev/next";

async function siguienteCancion() {

    const key = document.getElementById("admin-key").value;
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    try {

        const response = await fetch(nextURL, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${key}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Error";
            return;
        }

        result.textContent = "⏭ Pasamos a la siguiente canción";

        cargarAdminQueue();

    } catch (error) {
        result.textContent = "Error de conexión";
    }
}

async function agregarSolicitud() {

    const key = document.getElementById("admin-key").value;
    const text = document.getElementById("request-text").value.trim();
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    if (!text) {
        result.textContent = "Pega una canción.";
        return;
    }

    try {

        const response = await fetch(requestsURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
                text: text
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Error";
            return;
        }

        result.textContent = "✅ Agregada a la cola";
        document.getElementById("request-text").value = "";

    } catch (error) {

        result.textContent = "Error de conexión";

    }
}

async function cambiarEstado(live) {

    const key = document.getElementById("admin-key").value;
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    try {

        const response = await fetch(statusURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
                live: live
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Error";
            return;
        }

        result.textContent =
            live
            ? "🟢 LIVE ACTIVADO"
            : "⚫ MODO OFFLINE ACTIVADO";

    } catch (error) {

        result.textContent = "Error de conexión";

    }
}

const proofsURL =
    "https://playlist-api.bookingelbrayan.workers.dev/proofs";

const proofImageURL =
    "https://playlist-api.bookingelbrayan.workers.dev/proof-image";

let proofObjectURLs = [];

async function cargarPruebas() {

    const contenedor = document.getElementById("admin-proofs");
    const contador = document.getElementById("proofs-count");
    const key = document.getElementById("admin-key").value;

    if (!key) {
        contador.textContent = "0";
        contenedor.innerHTML =
            "<p>Escribe tu clave para ver las pruebas.</p>";
        return;
    }

    try {

        const response = await fetch(proofsURL, {
            headers: {
                "Authorization": `Bearer ${key}`
            }
        });

        const proofs = await response.json();

        if (!response.ok) {
            contenedor.innerHTML =
                `<p>${proofs.error || "Error cargando pruebas."}</p>`;
            return;
        }

        contador.textContent = proofs.length;

        // Liberamos imágenes anteriores del navegador
        proofObjectURLs.forEach(url => URL.revokeObjectURL(url));
        proofObjectURLs = [];

        if (proofs.length === 0) {
            contenedor.innerHTML =
                "<p>✅ No hay pruebas pendientes.</p>";
            return;
        }

        contenedor.innerHTML = "";

        for (const proof of proofs) {

            const card = document.createElement("div");
            card.className = "admin-proof-card";

            card.innerHTML = `
                <div class="admin-proof-info">
                    <strong>${nombreAccion(proof.action)}</strong>
                    <span>${recompensaAccion(proof.action)}</span>
                </div>

                <p>
                    🎵 ${proof.request_text}
                </p>

                <div class="proof-image-container">
                    Cargando captura...
                </div>

                <div class="admin-proof-actions">
                    <button disabled>
                        ✅ APROBAR
                    </button>

                    <button disabled>
                        ❌ RECHAZAR
                    </button>
                </div>
            `;

            contenedor.appendChild(card);

            const imageContainer =
                card.querySelector(".proof-image-container");

            try {

                const imageResponse = await fetch(
                    `${proofImageURL}/${proof.id}`,
                    {
                        headers: {
                            "Authorization": `Bearer ${key}`
                        }
                    }
                );

                if (!imageResponse.ok) {
                    imageContainer.textContent =
                        "No se pudo cargar la captura.";
                    continue;
                }

                const blob = await imageResponse.blob();
                const objectURL = URL.createObjectURL(blob);

                proofObjectURLs.push(objectURL);

                imageContainer.innerHTML = "";

                const img = document.createElement("img");
                img.src = objectURL;
                img.alt = "Captura de prueba";
                img.className = "admin-proof-image";

                imageContainer.appendChild(img);

            } catch (error) {
                imageContainer.textContent =
                    "Error cargando captura.";
            }
        }

    } catch (error) {
        contenedor.innerHTML =
            "<p>Error de conexión cargando pruebas.</p>";
    }
}

function nombreAccion(action) {

    const nombres = {
        instagram_follow: "📸 Seguir en Instagram",
        facebook_follow: "👍 Seguir en Facebook",
        instagram_like: "❤️ Like en Instagram",
        gafas_club: "🎵 Guardar GAFAS CLUB",
        uraba: "🌴 Guardar URABÁ",
        twitch_follow: "🟣 Seguir en Twitch"
    };

    return nombres[action] || action;
}

function recompensaAccion(action) {

    const recompensas = {
        instagram_follow: "+1 puesto",
        facebook_follow: "+1 puesto",
        instagram_like: "+2 puestos",
        gafas_club: "+5 puestos",
        uraba: "+5 puestos",
        twitch_follow: "+10 puestos"
    };

    return recompensas[action] || "";
}

cargarAdminQueue();
cargarPruebas();

setInterval(() => {
    cargarAdminQueue();
    cargarPruebas();
}, 5000);

</script>

</body>
</html>

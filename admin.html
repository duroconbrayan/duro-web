function escaparHTML(valor) {
    return String(valor ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function cargarAdminQueue() {

    const contenedor = document.getElementById("admin-queue");

    try {

        const response = await fetch(requestsURL);
        const requests = await response.json();

        const playing = requests.find(item => item.status === "playing");
        const queue = requests.filter(item => item.status === "queue");
        const played = requests
    .filter(item => item.status === "played")
    .sort((a, b) => new Date(b.played_at) - new Date(a.played_at));
    const numeroActual = playing?.play_number || played.length;

        let html = "";

        if (played.length > 0) {
    html += `
        <div class="admin-history">
            <small>YA SONARON</small>
    `;

    played.slice(0, 5).forEach(item => {
        html += `
            <div class="admin-history-item">
                <span>✓</span>
                <strong>${escaparHTML(item.text)}</strong>
            </div>
        `;
    });

    html += `</div>`;
}

        if (playing) {
            html += `
                <div class="admin-now-playing">
                    <small>AHORA SONANDO</small>
                    <strong>${escaparHTML(playing.text)}</strong>
                </div>
            `;
        }

        html += `
            <div class="admin-queue-list">
                <small>COLA</small>
        `;

       queue.forEach((item, index) => {
    html += `
        <div class="admin-queue-item">
            <span>#${numeroActual + index + 1}</span>
            <strong>${escaparHTML(item.text)}</strong>

            <button onclick="ponerSiguiente(${item.id})">

<button onclick="ponerGafasSiguiente(${item.id})">
    👓 GAFAS · SIGUIENTE
</button>

<button onclick="ponerGafasAhora(${item.id})">
    👓 GAFAS · SONAR AHORA
</button>

            <button onclick="eliminarSolicitud(${item.id})">
    🗑 ELIMINAR
</button>

        </div>
    `;
});

        html += `</div>`;

        contenedor.innerHTML = html;

    } catch (error) {
        contenedor.innerHTML = "Error cargando la cola.";
    }
}

async function agregarGafasSiguiente() {

    const key = document.getElementById("admin-key").value;
    const text = document.getElementById("request-text").value.trim();
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    if (!text) {
        result.textContent = "Pega una canción.";
        return;
    }

    try {

        const response = await fetch(giftAddNextURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
                text: text
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.error || "Error";
            return;
        }

        result.textContent = "👓 Gafas: agregada como siguiente";

        document.getElementById("request-text").value = "";

        cargarAdminQueue();

    } catch (error) {
        result.textContent = "Error de conexión";
    }
}

const proofsURL =
    "https://playlist-api.bookingelbrayan.workers.dev/proofs";

const proofImageURL =
    "https://playlist-api.bookingelbrayan.workers.dev/proof-image";

let proofObjectURLs = [];

async function cargarPruebas() {

    const contenedor = document.getElementById("admin-proofs");
    const contador = document.getElementById("proofs-count");
    const key = document.getElementById("admin-key").value;

    if (!key) {
        contador.textContent = "0";
        contenedor.innerHTML =
            "<p>Escribe tu clave para ver las pruebas.</p>";
        return;
    }

    try {

        const response = await fetch(proofsURL, {
            headers: {
                "Authorization": `Bearer ${key}`
            }
        });

        const proofs = await response.json();

        if (!response.ok) {
            contenedor.innerHTML =
    `<p>${escaparHTML(proofs.error || "Error cargando pruebas.")}</p>`;
            return;
        }

        contador.textContent = proofs.length;

        // Liberamos imágenes anteriores del navegador
        proofObjectURLs.forEach(url => URL.revokeObjectURL(url));
        proofObjectURLs = [];

        if (proofs.length === 0) {
            contenedor.innerHTML =
                "<p>✅ No hay pruebas pendientes.</p>";
            return;
        }

        contenedor.innerHTML = "";

        for (const proof of proofs) {

            const card = document.createElement("div");
            card.className = "admin-proof-card";

            card.innerHTML = `
                <div class="admin-proof-info">
                    <strong>${escaparHTML(nombreAccion(proof.action))}</strong>
<span>${escaparHTML(recompensaAccion(proof.action))}</span>
                </div>

                <p>
                    🎵 ${escaparHTML(proof.request_text)}
                </p>

                <div class="proof-image-container">
                    Cargando captura...
                </div>

                <div class="admin-proof-actions">
                    <button onclick="revisarPrueba(${proof.id}, 'approved')">
    ✅ APROBAR
</button>

<button onclick="revisarPrueba(${proof.id}, 'rejected')">
    ❌ RECHAZAR
</button>
                </div>
            `;

            contenedor.appendChild(card);

            const imageContainer =
                card.querySelector(".proof-image-container");

            try {

                const imageResponse = await fetch(
                    `${proofImageURL}/${proof.id}`,
                    {
                        headers: {
                            "Authorization": `Bearer ${key}`
                        }
                    }
                );

                if (!imageResponse.ok) {
                    imageContainer.textContent =
                        "No se pudo cargar la captura.";
                    continue;
                }

                const blob = await imageResponse.blob();
                const objectURL = URL.createObjectURL(blob);

                proofObjectURLs.push(objectURL);

                imageContainer.innerHTML = "";

                const img = document.createElement("img");
                img.src = objectURL;
                img.alt = "Captura de prueba";
                img.className = "admin-proof-image";

                imageContainer.appendChild(img);

            } catch (error) {
                imageContainer.textContent =
                    "Error cargando captura.";
            }
        }

    } catch (error) {
        contenedor.innerHTML =
            "<p>Error de conexión cargando pruebas.</p>";
    }
}

function nombreAccion(action) {

    const nombres = {
        instagram_follow: "📸 Seguir en Instagram",
        facebook_follow: "👍 Seguir en Facebook",
        instagram_like: "❤️ Like en Instagram",
        gafas_club: "🎵 Guardar GAFAS CLUB",
        uraba: "🌴 Guardar URABÁ",
        twitch_follow: "🟣 Seguir en Twitch"
    };

    return nombres[action] || action;
}

function recompensaAccion(action) {

    const recompensas = {
        instagram_follow: "+1 puesto",
        facebook_follow: "+1 puesto",
        instagram_like: "+2 puestos",
        gafas_club: "+5 puestos",
        uraba: "+5 puestos",
        twitch_follow: "+10 puestos"
    };

    return recompensas[action] || "";
}

const reviewProofURL =
    "https://playlist-api.bookingelbrayan.workers.dev/review-proof";

async function revisarPrueba(proofId, decision) {

    const key = document.getElementById("admin-key").value;
    const result = document.getElementById("admin-result");

    if (!key) {
        result.textContent = "Escribe tu clave.";
        return;
    }

    const textoDecision =
        decision === "approved" ? "aprobar" : "rechazar";

    const confirmar = confirm(
        `¿Seguro que quieres ${textoDecision} esta prueba?`
    );

    if (!confirmar) return;

    try {

        const response = await fetch(reviewProofURL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${key}`
            },
            body: JSON.stringify({
                proof_id: proofId,
                decision: decision
            })
        });

        const data = await response.json();

        if (!response.ok) {
            result.textContent =
                data.error || "Error revisando la prueba.";
            return;
        }

        if (decision === "approved") {
            result.textContent =
                `✅ Prueba aprobada · subió ${data.moved_up} puesto(s)`;
        } else {
            result.textContent =
                "❌ Prueba rechazada";
        }

        await cargarPruebas();
        await cargarAdminQueue();

    } catch (error) {
        result.textContent =
            "Error de conexión revisando la prueba.";
    }
}

        const response = await fetch(paymentsURL, {

        if (data.payments.length === 0) {

                        <small>
                            ${session.started_at || ""}
                            ${session.ended_at
                                ? ` → ${session.ended_at}`
                                : ""}
                        </small>
                    </div>

                    <div>
                        <strong>
                            👥 ${session.visitors} visitantes
                        </strong>

                        <span>
                            🎵 ${session.songs_processed} canciones
                        </span>

                        <span>
                            📸 ${session.proofs_approved} pruebas
                        </span>

                        <span>
                            💰 ${session.paypal_payments} pagos ·
                            $${Number(session.paypal_revenue).toFixed(2)}
                        </span>
<button onclick="copiarListaSesion(${session.id}, this)">
    📋 COPIAR LISTA
</button>

                    </div>

                </div>
            `;
        });

        contenedor.innerHTML = html;

    } catch (error) {

        contenedor.innerHTML =
            "<p>Error de conexión cargando métricas.</p>";
    }
}

async function copiarListaSesion(sessionId, boton) {

    const key = document.getElementById("admin-key").value;

    if (!key) {
        alert("Escribe tu clave.");
        return;
    }

    try {

        const response = await fetch(
            `${sessionSongsURL}?session_id=${sessionId}`,
            {
                headers: {
                    "Authorization": `Bearer ${key}`
                }
            }
        );

        const songs = await response.json();

        if (!response.ok) {
            alert(songs.error || "Error cargando la lista.");
            return;
        }

        if (songs.length === 0) {
            alert("Este directo no tiene lista guardada.");
            return;
        }

        const texto = songs
            .map(song => song.text)
            .join("\n");

        await navigator.clipboard.writeText(texto);

        const textoAnterior = boton.textContent;

        boton.textContent = `✅ ${songs.length} CANCIONES COPIADAS`;

        setTimeout(() => {
            boton.textContent = textoAnterior;
        }, 2000);

    } catch (error) {
        alert("Error copiando la lista.");
    }
}

cargarAdminQueue();
cargarPruebas();
cargarPagos();
cargarSesiones();

setInterval(() => {
    cargarAdminQueue();
    cargarPruebas();
    cargarPagos();
    cargarSesiones();
}, 5000);

</script>

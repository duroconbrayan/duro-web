<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playlist del Directo | DURO</title>

    <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

    <main class="container">

    <div class="playlist-header">

    <div class="live-badge">
        🔴 EN DIRECTO
    </div>

    <h1>DURO</h1>

    <p class="playlist-description">
        La comunidad controla la playlist del stream.
    </p>

</div>

<div class="now-playing">

    <div class="playing-animation">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="playing-info">

        <small>AHORA SONANDO</small>

        <div id="current-song">
            Esperando playlist...
        </div>

    </div>

</div>

    <div class="playlist-container">

    <div id="playlist-body"></div>

</div>

<div id="overlay" class="overlay" onclick="cerrarMenu()"></div>

<div id="song-menu" class="song-menu">

  <h3>🔥 OPCIONES DE LA CANCIÓN</h3>

<div id="selected-song"></div>

<p id="menu-subtitle"></p>

<div id="menu-contenido">

    <button id="btn-subir" onclick="mostrarOpcionesSubir()">⬆️ Subir canción</button>

    <button id="btn-saltar" onclick="mostrarOpcionesSaltar()">⏭️ Saltar directo</button>

    <button onclick="cerrarMenu()">❌ Cancelar</button>

</div>
</div>
    <a href="index.html">
        <button>⬅️ Volver al inicio</button>
    </a>

</main>

    <script src="script.js?v=6"></script>

</body>

</html>
